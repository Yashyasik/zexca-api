<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAXCA AI - Tech Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 80vh;
            border: 1px solid #30363d;
        }
        .chat-header {
            background: linear-gradient(90deg, #0052cc, #00d2ff);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            letter-spacing: 2px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user-msg {
            background-color: #238636;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .ai-msg {
            background-color: #21262d;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            border: 1px solid #30363d;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        input:focus {
            border-color: #00d2ff;
        }
        button {
            background-color: #00d2ff;
            color: #0d1117;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0052cc;
            color: white;
        }
        .loading {
            font-style: italic;
            color: #8b949e;
            font-size: 0.9rem;
            align-self: flex-start;
            display: none;
            padding-left: 20px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">⚡ ZAXCA AI ⚡</div>
    
    <div class="chat-box" id="chat-box">
        <div class="message ai-msg">Hello! I am ZAXCA AI. Systems online and fully charged! How can I help you today? 🚀</div>
    </div>
    
    <div class="loading" id="loading-msg">ZAXCA AI is typing... ⏳</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message here..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // உங்களோட உண்மையான Railway URL இங்க செட் பண்ணியாச்சு!
    const API_URL = "https://zexca-api-production.up.railway.app/generate";

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const loadingMsg = document.getElementById("loading-msg");
        
        const message = inputField.value.trim();
        if (!message) return;

        // User Message UI
        chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
        
        // Show loading
        loadingMsg.style.display = "block";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: message })
            });

            const data = await response.json();
            
            // Hide loading
            loadingMsg.style.display = "none";

            if (data.response) {
                chatBox.innerHTML += `<div class="message ai-msg"><strong>ZAXCA AI:</strong><br>${data.response.replace(/\n/g, '<br>')}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai-msg" style="color: red;">Error: ${data.error}</div>`;
            }
        } catch (error) {
            loadingMsg.style.display = "none";
            chatBox.innerHTML += `<div class="message ai-msg" style="color: red;">Connection Failed! Ensure Railway server is running.</div>`;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleEnter(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
